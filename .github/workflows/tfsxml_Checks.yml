name: Checks

on: [push, pull_request]

# A new push cancels the run of the previous one on the same branch or pull request, except on main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # GNU autotools, make check (unit tests, expected traces, traces with data in chunks, examples)
  Unix:
    strategy:
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-26.04
          - name: Linux (Clang)
            os: ubuntu-26.04
            CC: clang
            CXX: clang++
          - name: Linux ARM (unsigned char)
            os: ubuntu-26.04-arm
          - name: Linux (signed char)
            os: ubuntu-26.04-arm
            CFLAGS: -O2 -fsigned-char -Wall -Wextra -Werror
          - name: Linux (without C library functions)
            os: ubuntu-26.04
            configure: --enable-no_libc
          - name: Sanitizers
            os: ubuntu-26.04
            CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
            LDFLAGS: -fsanitize=address,undefined
          - name: macOS
            os: macos-26
      fail-fast: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC || 'cc' }}
      CXX: ${{ matrix.CXX || 'c++' }}
      CFLAGS: ${{ matrix.CFLAGS || '-O2 -Wall -Wextra -Werror' }}
      CXXFLAGS: ${{ matrix.CFLAGS || '-O2 -Wall -Wextra -Werror' }}
      LDFLAGS: ${{ matrix.LDFLAGS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Test files
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
          OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Branch with the same name in the fork of the author if it exists (changes of the expected traces), else main
          dir=../tfsxml-RegressionTestingFiles
          if ! git clone --depth=1 --branch "${BRANCH}" "https://github.com/${OWNER}/tfsxml-RegressionTestingFiles.git" "${dir}" 2>/dev/null; then
            rm -rf "${dir}"
            git clone --depth=1 https://github.com/MediaArea/tfsxml-RegressionTestingFiles.git "${dir}"
          fi
          git -C "${dir}" log -1 --format="Test files: %H %s"
      - name: OS packets
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install automake libtool
      - name: Configure
        run: |
          cd Project/GNU/Library
          autoreconf -if
          ./configure --enable-silent-rules ${{ matrix.configure }}
      - name: Compile
        run: make -C Project/GNU/Library -j4
      - name: Check
        run: make -C Project/GNU/Library check || (cat Project/GNU/Library/test-suite.log; exit 1)

  # CMake, CTest
  CMake:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-latest]
      fail-fast: false
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Test files
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
          OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Branch with the same name in the fork of the author if it exists (changes of the expected traces), else main
          dir=../tfsxml-RegressionTestingFiles
          if ! git clone --depth=1 --branch "${BRANCH}" "https://github.com/${OWNER}/tfsxml-RegressionTestingFiles.git" "${dir}" 2>/dev/null; then
            rm -rf "${dir}"
            git clone --depth=1 https://github.com/MediaArea/tfsxml-RegressionTestingFiles.git "${dir}"
          fi
          git -C "${dir}" log -1 --format="Test files: %H %s"
      - name: Compile
        run: |
          cmake -S Project/CMake -B Build -DCMAKE_BUILD_TYPE=Release
          cmake --build Build --config Release
      - name: Check
        run: ctest --test-dir Build -C Release --output-on-failure

  # Standard C89 and C++ compatibility of the library
  Standards:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check
        run: |
          for cc in gcc clang; do
            $cc -std=c89 -pedantic -Wall -Wextra -Wconversion -Werror -c Source/tfsxml/tfsxml.c -o c89.o
            $cc -std=c89 -pedantic -Wall -Wextra -Wconversion -Werror -DTFSXML_NO_LIBC -c Source/tfsxml/tfsxml.c -o c89_no_libc.o
          done
          g++ -x c++ -std=c++98 -pedantic -Wall -Wextra -Werror -c Source/tfsxml/tfsxml.c -o cpp.o
          printf '#include "tfsxml/tfsxml.h"\nint main() { tfsxml_string s = {}; return (int)tfsxml_decode(s).size(); }\n' > header.cpp
          g++ -std=c++11 -Wall -Wextra -Werror -ISource header.cpp Source/tfsxml/tfsxml.c -o header
          for cxx in g++ clang++; do
            $cxx -std=c++11 -pedantic -Wall -Wextra -Wshadow -Wconversion -Werror -c Source/tfsxml/tfsxml_tinyxml2.cpp -o tinyxml2.o
          done

  # tinyxml2 compatibility layer compared with tinyxml2 6.2.0: all test files, differential fuzzing
  TinyXml2:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Test files
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
          OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Branch with the same name in the fork of the author if it exists (changes of the expected traces), else main
          dir=../tfsxml-RegressionTestingFiles
          if ! git clone --depth=1 --branch "${BRANCH}" "https://github.com/${OWNER}/tfsxml-RegressionTestingFiles.git" "${dir}" 2>/dev/null; then
            rm -rf "${dir}"
            git clone --depth=1 https://github.com/MediaArea/tfsxml-RegressionTestingFiles.git "${dir}"
          fi
          git -C "${dir}" log -1 --format="Test files: %H %s"
      - name: tinyxml2
        run: git clone --depth 1 --branch 6.2.0 https://github.com/leethomason/tinyxml2.git Reference_tinyxml2
      - name: Compile
        run: |
          cmake -S Project/CMake -B Build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTFSXML_BUILD_FUZZER=ON -DTFSXML_BUILD_EXAMPLES=OFF -DTFSXML_TINYXML2_REFERENCE="${PWD}/Reference_tinyxml2"
          cmake --build Build -j4
      - name: Check
        run: ctest --test-dir Build --output-on-failure --no-tests=error -R TinyXml2
      - name: Fuzz
        run: |
          mkdir -p Corpus
          Build/tfsxml_Fuzz_TinyXml2 -fork=4 -max_total_time=300 -max_len=4096 -timeout=20 -dict=Source/Fuzz/Fuzz.dict -artifact_prefix=./ Corpus ../tfsxml-RegressionTestingFiles/TinyXml2 ../tfsxml-RegressionTestingFiles/Files
      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-tinyxml2-artifacts
          path: |
            crash-*
            timeout-*
            leak-*
            oom-*
          if-no-files-found: ignore

  # libFuzzer, and comparison with the previous version (informative: intended changes are reported too)
  Fuzz:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test files
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
          OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Branch with the same name in the fork of the author if it exists (changes of the expected traces), else main
          dir=../tfsxml-RegressionTestingFiles
          if ! git clone --depth=1 --branch "${BRANCH}" "https://github.com/${OWNER}/tfsxml-RegressionTestingFiles.git" "${dir}" 2>/dev/null; then
            rm -rf "${dir}"
            git clone --depth=1 https://github.com/MediaArea/tfsxml-RegressionTestingFiles.git "${dir}"
          fi
          git -C "${dir}" log -1 --format="Test files: %H %s"
      - name: Compile
        run: |
          cmake -S Project/CMake -B Build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTFSXML_BUILD_FUZZER=ON -DTFSXML_BUILD_TESTS=OFF -DTFSXML_BUILD_EXAMPLES=OFF
          cmake --build Build -j4
      - name: Fuzz
        run: |
          mkdir -p Corpus
          Build/tfsxml_Fuzz -fork=4 -max_total_time=300 -max_len=4096 -timeout=20 -dict=Source/Fuzz/Fuzz.dict -artifact_prefix=./ Corpus ../tfsxml-RegressionTestingFiles/Files
      - name: Reference version
        id: reference
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "${base}" ] && git cat-file -e "${base}:Source/tfsxml/tfsxml.c" 2>/dev/null && git cat-file -e "${base}:Source/tfsxml/tfsxml.h" 2>/dev/null; then
            mkdir -p Reference
            git show "${base}:Source/tfsxml/tfsxml.c" > Reference/tfsxml.c
            git show "${base}:Source/tfsxml/tfsxml.h" > Reference/tfsxml.h
            echo "path=${PWD}/Reference/tfsxml.c" >> "${GITHUB_OUTPUT}"
          fi
      - name: Fuzz compared to the reference version
        if: steps.reference.outputs.path
        continue-on-error: true
        run: |
          cmake -S Project/CMake -B Build_Reference -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTFSXML_BUILD_FUZZER=ON -DTFSXML_BUILD_TESTS=OFF -DTFSXML_BUILD_EXAMPLES=OFF -DTFSXML_FUZZ_REFERENCE="${{ steps.reference.outputs.path }}"
          cmake --build Build_Reference -j4
          Build_Reference/tfsxml_Fuzz -fork=4 -max_total_time=120 -max_len=4096 -timeout=20 -dict=Source/Fuzz/Fuzz.dict -artifact_prefix=./reference- Corpus ../tfsxml-RegressionTestingFiles/Files
      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            crash-*
            timeout-*
            leak-*
            oom-*
            reference-*
          if-no-files-found: ignore
